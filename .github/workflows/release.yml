name: Package macOS DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and drag-and-drop DMG
        run: ./scripts/build-dmg.sh
        env:
          LITTLE_PLANT_UNIVERSAL: '1'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Little-Plant-macOS
          path: |
            dist/Little-Plant.dmg
            dist/Little-Plant.dmg.sha256
      - name: Create draft release for review
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Little-Plant.dmg dist/Little-Plant.dmg.sha256 \
            --draft --generate-notes --title "Little Plant $GITHUB_REF_NAME"
